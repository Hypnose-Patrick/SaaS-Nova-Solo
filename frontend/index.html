<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nova Solo</title>
    <meta name="description" content="L'assistant des indépendants suisse romands" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body style="background:#0a0a0a;margin:0">
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("ns_theme");
          var mode = raw ? JSON.parse(raw) : "dark";
          var resolved = mode === "system"
            ? (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")
            : mode;
          var theme = resolved === "light" ? "light" : "dark";
          document.documentElement.setAttribute("data-theme", theme);
          // Le fond de <body> est codé en dur ci-dessus (fallback avant chargement des
          // tokens CSS) : on le corrige tout de suite si le thème résolu est clair.
          if (theme === "light") document.body.style.background = "#f7f4ee";
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
