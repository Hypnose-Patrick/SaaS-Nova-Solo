name: Build & Deploy — DÉSARMÉ (le site suisse part depuis SaaS-Nova-France)

# ┌─ DÉSARMÉ LE 2026-07-31 — NE PAS REMETTRE LE DÉCLENCHEUR `push` ──────────────┐
# │                                                                              │
# │ Le site start-mybusiness.com est désormais bâti et déployé depuis le dépôt   │
# │ Hypnose-Patrick/SaaS-Nova-France, workflow `build-deploy-ch.yml`. Les deux    │
# │ dépôts visaient le MÊME `/public_html/`, avec le même compte FTP.            │
# │                                                                              │
# │ Ce que ce workflow ferait s'il restait armé : à la première poussée sur      │
# │ `master`, il remettrait en ligne le build d'AVANT l'alignement — ancien      │
# │ contenu, anciens textes légaux, sur la même base de données. Sans erreur,    │
# │ sans alerte, sans qu'aucun job n'échoue. Un retour en arrière silencieux,    │
# │ qui coûte des jours à diagnostiquer précisément parce que rien ne casse.     │
# │                                                                              │
# │ Le `workflow_dispatch` est conservé : il permet de redéployer volontairement │
# │ l'ancienne version si l'alignement devait être annulé. C'est un filet, pas   │
# │ un usage courant — et ça reste un clic délibéré, pas un effet de bord d'une  │
# │ poussée de code.                                                             │
# │                                                                              │
# │ Voir docs/ALIGNEMENT-SUISSE.md dans le dépôt France, phase C tâche 7.        │
# └──────────────────────────────────────────────────────────────────────────────┘

on:
  # push: DÉSARMÉ — voir le bandeau ci-dessus avant de le rétablir.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      # Gate qualité AVANT le déploiement : `npm run build` = `vite build` seul
      # (esbuild ignore les types), donc sans ce garde-fou une erreur de type
      # partirait en prod. Le type-check est bloquant ; si tsc échoue, l'étape
      # de déploiement FTP ci-dessous ne s'exécute pas.
      - name: Type check (bloquant)
        working-directory: ./frontend
        run: npm run type-check

      # Lint bloquant : 0 erreur dans le code (les warnings ne bloquent pas —
      # pas de --max-warnings). Une erreur ESLint empêche désormais le déploiement.
      - name: Lint (bloquant)
        working-directory: ./frontend
        run: npm run lint

      # Hostinger héberge TOUT le site : la landing (servie à la racine via .htaccess)
      # ET l'app React (SPA — routes /login, /subscribe…). `npm run build` (Vite) produit
      # frontend/dist/ = index.html (SPA) + landing.html + .htaccess + assets. Les variables
      # VITE_* (dont VITE_APP_URL=https://start-mybusiness.com) viennent de frontend/.env.production.
      - name: Build app + landing for Hostinger
        working-directory: ./frontend
        run: npm run build

      # 1re tentative — non bloquante : si l'upload FTP flanche (Hostinger ferme
      # parfois le socket), le job ne meurt pas ici, le retry ci-dessous prend le relais.
      - name: Deploy full site to Hostinger (FTP)
        id: deploy
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 72.60.93.168
          username: u202854150.start-mybusiness.com
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./frontend/dist/
          server-dir: /public_html/
          # 60s (au lieu de 30s par défaut) réduit les échecs aléatoires.
          timeout: 60000
          exclude: |
            **/.git*
            **/.git*/**

      # Retry auto UNIQUEMENT si le 1er upload a réellement tourné puis échoué
      # (si le gate/build a planté, `deploy` est "skipped" → pas de retry).
      # Ce step est bloquant : s'il échoue aussi, le déploiement est en échec.
      - name: Deploy retry (Hostinger FTP flaky)
        if: steps.deploy.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 72.60.93.168
          username: u202854150.start-mybusiness.com
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./frontend/dist/
          server-dir: /public_html/
          timeout: 60000
          exclude: |
            **/.git*
            **/.git*/**

      # Vérification post-deploy : les règles structurantes de l'ADR 2026-06-30
      # (Hostinger hôte unique) sont contrôlées EN PROD après chaque upload :
      #   / = landing (jamais la SPA), /login = SPA (id="root" + bundle), et le
      #   bundle référencé répond réellement (attrape un upload FTP partiel).
      # Résultat notifié sur Telegram (Patrick) via le webhook d'alerte Hermes.
      - name: Verify deployment (règles ADR 2026-06-30)
        run: |
          sleep 10   # laisse Hostinger/LiteSpeed servir les nouveaux fichiers
          BASE=https://start-mybusiness.com
          HOOK=https://n8n.srv1331196.hstgr.cloud/webhook/hermes-alert-x7q2v9
          fail=""

          landing=$(curl -s -m 20 "$BASE/")
          echo "$landing" | grep -q '/assets/index-' && fail="$fail / sert la SPA au lieu de la landing;"
          [ -z "$landing" ] && fail="$fail / vide ou injoignable;"

          spa=$(curl -s -m 20 "$BASE/login")
          echo "$spa" | grep -q 'id="root"' || fail="$fail /login ne sert pas la SPA (id=root absent);"

          bundle=$(echo "$spa" | grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' | head -1)
          if [ -n "$bundle" ]; then
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 20 "$BASE$bundle")
            [ "$code" = "200" ] || fail="$fail bundle $bundle en HTTP $code (upload partiel ?);"
          else
            fail="$fail aucun bundle référencé par /login;"
          fi

          if [ -n "$fail" ]; then
            msg="❌ DEPLOY Nova Solo (${GITHUB_SHA:0:7}) : vérification post-deploy en ÉCHEC —$fail voir Actions."
            curl -s -m 15 -X POST "$HOOK" -H 'Content-Type: application/json' \
              --data "$(printf '{"text":"%s"}' "$msg")" >/dev/null || true
            echo "::error::$msg"
            exit 1
          fi
          msg="✅ DEPLOY Nova Solo (${GITHUB_SHA:0:7}) vérifié : landing OK, SPA /login OK, bundle $bundle OK."
          curl -s -m 15 -X POST "$HOOK" -H 'Content-Type: application/json' \
            --data "$(printf '{"text":"%s"}' "$msg")" >/dev/null || true
          echo "$msg"
